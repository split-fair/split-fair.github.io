workflows:
  # Manual / API-triggered: build, upload, set App Store metadata, submit for review.
  # Trigger: POST https://api.codemagic.io/builds {"appId":..., "workflowId":"ios-app-store", "branch":"main"}
  ios-app-store:
    name: Split Fair — iOS App Store release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - ios-signing
      vars:
        BUNDLE_ID: "com.splitfair.rentSplit"
        APP_STORE_APPLE_ID: "6761033612"
        ASO_KEYWORDS: "splitfair,splitfare,splitwise,splitrent,housemate,sublet,lease,divide,landlord,bills,budget,share"
        WHATS_NEW: "Performance improvements and bug fixes. Thanks for using Split Fair!"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing
        script: |
          set -e  # fail here (not later at build) if ASC API rejects the key, e.g. 403 agreement expired
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Get Flutter packages
        # 2026-11-02: newer stable Flutter enables Swift Package Manager by default; google_mobile_ads is
        # CocoaPods-only, so pod install fails with a "dependency conflict". Turn SPM off for this build
        # (Flutter's documented workaround) until google_mobile_ads ships SPM support.
        script: |
          flutter config --no-enable-swift-package-manager
          flutter packages pub get
      - name: Build IPA (build number above anything ASC has seen)
        script: |
          set -e
          TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tail -n1 | tr -dc '0-9')
          AS=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tail -n1 | tr -dc '0-9')
          PUB=$(grep '^version:' pubspec.yaml | cut -d'+' -f2 | tr -dc '0-9')
          MAX=0
          for n in "$TF" "$AS" "$PUB"; do
            if [ -n "$n" ] && [ "$n" -gt "$MAX" ]; then MAX=$n; fi
          done
          BUILD_NUM=$((MAX + 1))
          echo "Latest TestFlight=$TF AppStore=$AS pubspec=$PUB -> building $BUILD_NUM"
          flutter build ipa --release \
            --build-number=$BUILD_NUM \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Upload, set keywords + What's New, submit for App Store review
        script: |
          set -e
          app-store-connect publish \
            --path "build/ios/ipa/*.ipa" \
            --app-store \
            --release-type AFTER_APPROVAL \
            --keywords "$ASO_KEYWORDS" \
            --whats-new "$WHATS_NEW" \
            --max-build-processing-wait 60
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - clairmont425@gmail.com
        notify:
          success: true
          failure: true

  ios-testflight:
    name: Split Fair — iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - ios-signing
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Auto-increment build number
        script: |
          cd $CM_BUILD_DIR
          # Use app-store-connect to get latest TestFlight build, or fallback to timestamp
          LATEST=$(app-store-connect get-latest-testflight-build-number "com.splitfair.rentSplit" 2>/dev/null || echo "0")
          if [ "$LATEST" -gt 0 ] 2>/dev/null; then
            BUILD_NUM=$((LATEST + 1))
          else
            # Fallback: epoch-based to guarantee uniqueness
            BUILD_NUM=$(date +%s | tail -c 6)
          fi
          CURRENT_VER=$(grep 'version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          sed -i '' "s/version: .*/version: ${CURRENT_VER}+${BUILD_NUM}/" pubspec.yaml
          echo "Building version: ${CURRENT_VER}+${BUILD_NUM}"
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files \
            com.splitfair.rentSplit \
            --type IOS_APP_STORE \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY" \
            --create
      - name: Get Flutter packages and run project migrations
        script: |
          flutter packages pub get
          flutter build ios --release --no-codesign || true
      - name: Apply code signing after migrations
        script: |
          keychain add-certificates
          xcode-project use-profiles
      - name: Archive and export IPA
        script: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/ios/Runner.xcarchive \
            archive
          xcodebuild \
            -exportArchive \
            -archivePath $CM_BUILD_DIR/ios/Runner.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath $CM_BUILD_DIR/ios/ipa
    artifacts:
      - $CM_BUILD_DIR/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - External Testers

  android-release:
    name: Split Fair — Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    environment:
      flutter: stable
      groups:
        - android-signing
        - google-play
      vars:
        PACKAGE_NAME: "com.splitfair.rent_split"
        KEY_ALIAS: "split-fair"
    scripts:
      - name: Auto-increment build number
        script: |
          cd $CM_BUILD_DIR
          # Use epoch-based build number to guarantee uniqueness
          BUILD_NUM=$(date +%s | tail -c 6)
          CURRENT_VER=$(grep 'version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          sed -i '' "s/version: .*/version: ${CURRENT_VER}+${BUILD_NUM}/" pubspec.yaml
          echo "Building version: ${CURRENT_VER}+${BUILD_NUM}"
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Set up Android keystore
        script: |
          echo $CM_KEYSTORE_B64 | base64 --decode > $CM_BUILD_DIR/split-fair-release.jks
          export KEYSTORE_PATH=$CM_BUILD_DIR/split-fair-release.jks
          export KEYSTORE_PASSWORD=$CM_KEYSTORE_PASSWORD
          export KEY_PASSWORD=$CM_KEY_PASSWORD
      - name: Build Android APK and AAB
        script: |
          export KEYSTORE_PATH=$CM_BUILD_DIR/split-fair-release.jks
          export KEYSTORE_PASSWORD=$CM_KEYSTORE_PASSWORD
          export KEY_ALIAS=split-fair
          export KEY_PASSWORD=$CM_KEY_PASSWORD
          flutter build apk --release
          flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - clairmont425@gmail.com
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
